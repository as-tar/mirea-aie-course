[project]
name = "rag-project"
version = "0.1.0"
description = "RAG по внутренней документации компании"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arize-phoenix>=17.9.0",
    "chromadb>=1.5.9",
    "deepeval>=4.0.6",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.9",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langchain-experimental>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "markitdown[docx,pdf,xlsx]>=0.1.6",
    "matplotlib>=3.11.0",
    "nltk>=3.9.4",
    "openinference-instrumentation-langchain>=0.1.66",
    "pydantic-ai[mcp]<2.0.0",
    "pytest>=9.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.58.0",
    "torch>=2.10.0",
    "uvicorn>=0.49.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }